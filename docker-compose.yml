services:
  oracle26ai:
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/free:latest}
    container_name: oracle26ai
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD:-OraclePwd123}
    volumes:
      - oracle-data:/opt/oracle/oradata

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracking-eu-demo
    ports:
      - "8502:8502"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - ORACLE_USER=${ORACLE_USER:-tracking}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-TrackingPwd123}
      - ORACLE_DSN=${ORACLE_DSN:-oracle26ai:1521/FREEPDB1}
    depends_on:
      - oracle26ai

volumes:
  oracle-data:
